
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gito Poeta - Oficial</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#f0f2f5}
header{background:#fff;position:sticky;top:0;z-index:99;border-bottom:3px solid #c41c1c}
.top{padding:10px 14px;display:flex;align-items:center;gap:14px}.top b{font-size:28px;color:#d81b26;flex:1}
.nav{display:flex;justify-content:space-around;padding:8px 0;font-size:26px;border-top:1px solid #eee}.nav a{text-decoration:none}
.think{display:flex;gap:10px;background:#fff;padding:12px;margin-bottom:8px;align-items:center}.think img{width:42px;height:42px;border-radius:50%}.think div{flex:1;background:#f0f2f5;padding:12px 16px;border-radius:24px;color:#555}
.carrossel{display:flex;gap:10px;overflow-x:auto;padding:10px;background:#fff;scroll-snap-type:x mandatory;cursor:grab}.carrossel::-webkit-scrollbar{display:none}
.card{min-width:130px;height:210px;border-radius:14px;overflow:hidden;position:relative;flex-shrink:0;scroll-snap-align:start;background:#000}
.card img{width:100%;height:100%;object-fit:cover;opacity:.9}.card span{position:absolute;bottom:8px;left:8px;color:#fff;font-weight:700;line-height:1.1;text-shadow:0 2px 4px #000}
.criar{background:#fff !important;border:1px solid #ddd;display:flex;flex-direction:column}.criar img{height:140px}.criar .plus{position:absolute;top:120px;left:50%;transform:translateX(-50%);background:#1877f2;color:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:3px solid #fff;font-size:22px}.criar b{color:#000;text-align:center;padding:28px 0 10px}
</style>
</head>
<body>
<header>
<div class="top"><span style="font-size:30px">☰</span><b>Gito Poeta</b><span>🔍</span></div>
<div class="nav">
<a href="#home" title="Home">🏠</a>
<a href="#fotos" title="Fotos">🖼️</a>
<a href="#radio" title="Rádio">📻</a>
<a href="#vote" title="Vote">🗳️</a>
<a href="#audio" title="Áudios">🎧</a>
<a href="#perfil" title="Perfil">👤</a>
</div>
</header>

<div class="think"><img src="https://i.pravatar.cc/100?img=68"><div>No que você está pensando?</div></div>

<div class="carrossel" id="slider">
<div class="card criar" onclick="alert('Abrir criador de Story')"><img src="https://i.pravatar.cc/300?img=68"><div class="plus">+</div><b>Criar<br>story</b></div>
<div class="card" onclick="window.open('#insight','_self')"><img src="https://picsum.photos/300/500?random=1"><span>Novo<br>insight</span></div>
<div class="card" onclick="window.open('#cuba','_self')"><img src="https://picsum.photos/300/500?random=2"><span>Cuba<br>Socialista</span></div>
<div class="card" onclick="window.open('#poesias','_self')"><img src="https://picsum.photos/300/500?random=3"><span>Poesias<br>de Luta</span></div>
<div class="card" onclick="window.open('#pcb','_self')"><img src="https://picsum.photos/300/500?random=4"><span>PCB-RN</span></div>
</div>

<script>
const s=document.getElementById('slider');let d=false,x0,sl; s.addEventListener('mousedown',e=>{d=true;x0=e.pageX-s.offsetLeft;sl=s.scrollLeft}); s.addEventListener('mouseup',()=>d=false); s.addEventListener('mouseleave',()=>d=false); s.addEventListener('mousemove',e=>{if(!d)return;e.preventDefault();const x=e.pageX-s.offsetLeft; s.scrollLeft=sl-(x-x0)*1.8});
</script>
</body>
</html>
