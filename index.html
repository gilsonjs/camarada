<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Companheiro Santos, uma história de luta</title>
    <style>
        :root {
            --vermelho-principal: #cc0000;
            --vermelho-escuro: #4a0000;
            --amarelo-ouro: #ffcc00;
            --fundo-pagina: #f8f9fa;
            --branco: #ffffff;
            --texto-escuro: #111111;
            --texto-mutado: #495057;
            --borda-suave: #e9ecef;
            --sombra-card: 0 4px 12px rgba(0,0,0,0.05);
        }

        /* CONFIGURAÇÃO INTERNA CONTRA VAZAMENTOS DE TELA */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--fundo-pagina);
            color: var(--texto-escuro);
            line-height: 1.6;
            font-size: 1rem;
            max-width: 100%;
            overflow-x: hidden;
        }

        /* HEADER EDITORIAL PROFISSIONAL */
        .topo-editorial {
            background: linear-gradient(135deg, var(--vermelho-escuro) 0%, var(--vermelho-principal) 100%);
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 5px solid var(--amarelo-ouro);
        }

        .topo-editorial h1 {
            color: var(--branco);
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -0.3px;
            line-height: 1.3;
        }

        /* BARRA DE MENU SUPERIOR ROBUSTA (FUNCIONAMENTO GARANTIDO) */
        .menu-navegacao-topo {
            background-color: var(--branco);
            border-bottom: 1px solid var(--borda-suave);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 0.6rem 0.4rem;
        }

        .menu-grid-botoes {
            max-width: 750px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.3rem;
        }

        .btn-link-menu {
            color: var(--texto-escuro);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.7rem;
            text-transform: uppercase;
            padding: 0.5rem 0.2rem;
            border-radius: 4px;
            background-color: #f1f3f5;
            transition: all 0.2s ease;
            text-align: center;
            border: 1px solid #dee2e6;
            display: block;
        }

        .btn-link-menu:hover {
            background-color: var(--vermelho-principal);
            color: var(--branco);
            border-color: var(--vermelho-principal);
        }

        .btn-link-menu.destaque-aba {
            background-color: var(--amarelo-ouro);
            border-color: #e0b400;
        }

        /* CORPO DO PORTAL */
        .container-principal {
            max-width: 750px;
            margin: 1.2rem auto;
            padding: 0 0.8rem;
        }

        .secao-card-editorial {
            background: var(--branco);
            padding: 1.5rem 1.2rem;
            border-radius: 8px;
            border: 1px solid var(--borda-suave);
            box-shadow: var(--sombra-card);
            margin-bottom: 1.5rem;
            width: 100%;
        }

        .titulo-secao-portal {
            color: var(--vermelho-principal);
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 0.8rem;
            border-bottom: 2px solid var(--borda-suave);
            padding-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .titulo-secao-portal::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 18px;
            background-color: var(--amarelo-ouro);
            flex-shrink: 0;
        }

        .meta-sub-dados {
            font-size: 0.8rem;
            color: var(--texto-mutado);
            margin-top: -0.5rem;
            margin-bottom: 1.2rem;
            font-style: italic;
            line-height: 1.4;
        }

        p.paragrafo-limpo {
            margin-bottom: 1rem;
            font-size: 0.95rem;
            text-align: justify;
            color: #2b2b2b;
        }

        .caixa-testemunho-bloco {
            background-color: #fffdf2;
            border-left: 4px solid var(--vermelho-principal);
            padding: 1rem;
            margin: 1.2rem 0;
            font-style: italic;
            font-size: 0.95rem;
            color: #111111;
            border-radius: 0 6px 6px 0;
        }

        /* GALERIA INTEGRADA DE ARQUIVOS */
        .grade-arquivos-visuais {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.2rem;
            margin-top: 0.8rem;
        }

        .card-foto-tecnica {
            background: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 8px;
        }

        .area-imagem-placeholder {
            background-color: #f8f9fa;
            border: 2px dashed var(--vermelho-principal);
            border-radius: 6px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .area-imagem-placeholder img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
        }

        .badge-nome-arquivo {
            background-color: var(--texto-escuro);
            color: var(--amarelo-ouro);
            font-family: monospace;
            font-size: 0.85rem;
            font-weight: bold;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            margin-bottom: 6px;
        }

        .legenda-tecnica-sistema {
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px solid var(--borda-suave);
            font-size: 0.8rem;
            color: var(--texto-mutado);
            text-align: left;
            line-height: 1.4;
        }

        .legenda-tecnica-sistema strong {
            color: var(--vermelho-principal);
        }

        /* MANIFESTO E LISTAGENS */
        .categoria-pauta-jornal {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            margin: 1rem 0 0.4rem 0;
            color: var(--vermelho-escuro);
        }

        .lista-pautas-jornal {
            list-style: none;
            margin-bottom: 1rem;
        }

        .lista-pautas-jornal li {
            position: relative;
            padding-left: 1rem;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
            color: #333333;
        }

        .lista-pautas-jornal li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--vermelho-principal);
            font-weight: bold;
        }

        /* CHAPA 2 NOMINATA */
        .bloco-cargo-nominata {
            background: #f8f9fa;
            padding: 0.8rem;
            border-radius: 6px;
            margin-bottom: 0.8rem;
            border-left: 3px solid var(--amarelo-ouro);
        }

        .bloco-cargo-nominata h4 {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--vermelho-principal);
            margin-bottom: 0.4rem;
        }

        .bloco-cargo-nominata ul {
            list-style: none;
            font-size: 0.85rem;
            color: #333333;
        }

        .bloco-cargo-nominata li {
            margin-bottom: 0.3rem;
            border-bottom: 1px dashed #e9ecef;
            padding-bottom: 2px;
        }

        /* RODAPÉ INSTITUCIONAL DETALHADO */
        .rodape-memorial {
            background-color: #111111;
            color: #ffffff;
            padding: 2rem 1rem;
            text-align: center;
            border-top: 4px solid var(--vermelho-principal);
            margin-top: 3rem;
            font-size: 0.75rem;
        }

        .rodape-editorial-aviso {
            color: var(--amarelo-ouro);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 0.6rem;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .creditos-projeto-tecnico {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #2d2d2d;
            color: #adb5bd;
            line-height: 1.5;
            text-align: center;
        }

        .creditos-projeto-tecnico span {
            color: #ffffff;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .topo-editorial h1 { font-size: 1.2rem; }
            .btn-link-menu { font-size: 0.65rem; padding: 0.4rem 0.1rem; }
            .secao-card-editorial { padding: 1rem 0.8rem; }
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <div class="topo-editorial">
        <h1>Companheiro Santos, uma história de luta</h1>
    </div>

    <!-- MENU DO TOPO FUNCIONAL E SEGURO -->
    <div class="menu-navegacao-topo">
        <div class="menu-grid-botoes">
            <a href="#secao-fotos" class="btn-link-menu destaque-aba">🖼️ Fotos</a>
            <a href="#secao-depoimento" class="btn-link-menu">📖 Texto</a>
            <a href="#secao-manifesto" class="btn-link-menu">📰 Jornal</a>
            <a href="#secao-chapa" class="btn-link-menu">👥 Chapa 2</a>
        </div>
    </div>

    <!-- CORPO CENTRAL -->
    <div class="container-principal">

        <!-- SEÇÃO: ACERVO VISUAL -->
